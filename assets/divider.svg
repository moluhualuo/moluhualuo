<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24">
  <defs>
    <linearGradient id="d1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#9b5de5" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#f15bb5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f15bb5" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- main bar -->
  <rect x="30" y="11" width="740" height="2" rx="1" fill="url(#d1)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- glow bar -->
  <rect x="100" y="11" width="600" height="1" rx="0.5" fill="#00F2FE" opacity="0.3" filter="url(#gl)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- center diamond -->
  <polygon points="400,7 406,12 400,17 394,12" fill="#9b5de5" filter="url(#gl)">
    <animate attributeName="fill" values="#9b5de5;#f15bb5;#00F2FE;#9b5de5" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 400 12;360 400 12" dur="8s" repeatCount="indefinite"/>
  </polygon>

  <!-- floating dots -->
  <circle cx="250" cy="12" r="2" fill="#00F2FE" opacity="0.6">
    <animate attributeName="cx" values="250;260;250" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="12" r="2" fill="#f15bb5" opacity="0.6">
    <animate attributeName="cx" values="550;540;550" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
