<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="100%" height="12">
  <defs>
    <linearGradient id="d1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#9b5de5" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="5" width="720" height="2" rx="1" fill="url(#d1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="400" cy="6" r="3" fill="#9b5de5">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="6" r="1.5" fill="#00F2FE" opacity="0.5">
    <animate attributeName="cx" values="300;310;300" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="6" r="1.5" fill="#f15bb5" opacity="0.5">
    <animate attributeName="cx" values="500;490;500" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
