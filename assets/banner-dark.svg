<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#f15bb5"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="800" height="240" fill="url(#bg)" rx="16"/>
  <rect width="800" height="240" fill="url(#grid)" rx="16"/>

  <!-- animated particles -->
  <circle cx="0" cy="0" r="3" fill="#00F2FE" opacity="0.6">
    <animateMotion dur="8s" repeatCount="indefinite" path="M0,0 C200,50 400,200 800,80"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#f15bb5" opacity="0.5">
    <animateMotion dur="10s" repeatCount="indefinite" path="M0,0 C150,150 500,100 800,30" begin="2s"/>
    <animate attributeName="opacity" values="0;5;0" dur="10s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="0" cy="0" r="2.5" fill="#9b5de5" opacity="0.5">
    <animateMotion dur="9s" repeatCount="indefinite" path="M0,0 C300,60 600,180 800,60" begin="4s"/>
    <animate attributeName="opacity" values="0;5;0" dur="9s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <circle cx="0" cy="0" r="1.5" fill="#4facfe" opacity="0.4">
    <animateMotion dur="7s" repeatCount="indefinite" path="M0,0 C250,150 550,90 800,120" begin="1s"/>
    <animate attributeName="opacity" values="0;4;0" dur="7s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#00F2FE" opacity="0.3">
    <animateMotion dur="11s" repeatCount="indefinite" path="M0,0 C100,200 300,30 800,80" begin="3s"/>
    <animate attributeName="opacity" values="0;3;0" dur="11s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- pulsing nodes -->
  <circle cx="130" cy="80" r="4" fill="#00F2FE" opacity="0.7">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="80" r="10" fill="none" stroke="#00F2FE" stroke-opacity="0.15" stroke-width="1">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.15;0.05;0.15" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="680" cy="120" r="5" fill="#f15bb5" opacity="0.7">
    <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="120" r="12" fill="none" stroke="#f15bb5" stroke-opacity="0.12" stroke-width="1">
    <animate attributeName="r" values="12;18;12" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.12;0.04;0.12" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="420" cy="200" r="3" fill="#9b5de5" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- decorative wave lines -->
  <path d="M 60 200 Q 200 180 400 220 T 800 200" fill="none" stroke="#00F2FE" stroke-opacity="0.06" stroke-width="1.5">
    <animate attributeName="d" values="M 60 200 Q 200 180 400 220 T 800 200;M 60 200 Q 200 220 400 180 T 800 200;M 60 200 Q 200 180 400 220 T 800 200" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- title with glow -->
  <text x="60" y="75" font-family="'Segoe UI',-apple-system,sans-serif" font-size="34" font-weight="800" fill="url(#title)" filter="url(#glow)">
    MoluHuaLuo
  </text>

  <text x="60" y="118" font-family="'Segoe UI',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">
    花落 · Open Source Developer
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="152" font-family="'Consolas','Cascadia Code','JetBrains Mono',monospace" font-size="14" fill="#94A3B8">
    <tspan>AI Agents</tspan>
    <tspan fill="#334155" dx="12">|</tspan>
    <tspan dx="12">MCP Ecosystem</tspan>
    <tspan fill="#334155" dx="12">|</tspan>
    <tspan dx="12">Win &amp; Android Automation</tspan>
  </text>

  <!-- tech pill badges -->
  <g font-family="'Segoe UI',-apple-system,sans-serif" font-size="10" text-anchor="middle">
    <rect x="510" y="170" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="537" y="185" fill="#00F2FE">C/C++</text>

    <rect x="575" y="170" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="602" y="185" fill="#c084fc">Python</text>

    <rect x="640" y="170" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="667" y="185" fill="#fbbf24">Java</text>

    <rect x="705" y="170" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="732" y="185" fill="#34d399">Vue</text>
  </g>

  <!-- bottom status -->
  <text x="60" y="225" font-family="'Segoe UI',-apple-system,sans-serif" font-size="11" fill="#475569">
    <tspan>MIT Licensed</tspan>
    <tspan dx="10" fill="#334155">|</tspan>
    <tspan dx="10">github.com/moluhualuo</tspan>
  </text>
</svg>
