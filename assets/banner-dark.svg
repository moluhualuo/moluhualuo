<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="380">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="titleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-100 0;0 0" dur="5s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>
    <linearGradient id="typeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>
    <linearGradient id="scanX" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#9b5de5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="hexGrid" width="30" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L30 26 L15 52 L0 26 Z" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
      <path d="M15 52 L30 26 L45 52" fill="none" stroke="#ffffff" stroke-opacity="0.01" stroke-width="0.3"/>
    </pattern>
    <clipPath id="typeArea">
      <rect x="60" y="202" width="500" height="30"/>
    </clipPath>
  </defs>

  <!-- bg -->
  <rect width="800" height="380" fill="url(#bgR)"/>
  <rect width="800" height="380" fill="url(#hexGrid)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="20" cy="30" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="55" r="0.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="160" cy="20" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="230" cy="70" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="310" cy="15" r="1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="390" cy="40" r="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="450" cy="25" r="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="520" cy="55" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="580" cy="18" r="0.8"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="650" cy="45" r="0.7"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.2s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="720" cy="25" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="770" cy="60" r="0.5"><animate attributeName="opacity" values="0.4;0.6;0.4" dur="2.9s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="50" cy="120" r="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.1s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="170" cy="135" r="0.9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.7s" repeatCount="indefinite" begin="0.1s"/></circle>
    <circle cx="340" cy="125" r="0.5"><animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.4s" repeatCount="indefinite" begin="2.1s"/></circle>
    <circle cx="480" cy="145" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="630" cy="105" r="0.7"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.7s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="750" cy="130" r="1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.3s" repeatCount="indefinite" begin="0.4s"/></circle>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="800" height="2" fill="url(#scanX)">
    <animate attributeName="y" values="0;380;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- data flow -->
  <g stroke="#00F2FE" stroke-opacity="0.06" stroke-width="1" fill="none">
    <path d="M 0 200 Q 150 175 300 205"><animate attributeName="d" values="M 0 200 Q 150 175 300 205;M 0 210 Q 150 185 300 195;M 0 200 Q 150 175 300 205" dur="4s" repeatCount="indefinite"/></path>
    <path d="M 500 160 Q 650 170 800 150"><animate attributeName="d" values="M 500 160 Q 650 170 800 150;M 500 170 Q 650 160 800 160;M 500 160 Q 650 170 800 150" dur="5s" repeatCount="indefinite"/></path>
  </g>

  <!-- orbit rings -->
  <ellipse cx="400" cy="190" rx="300" ry="50" fill="none" stroke="#00F2FE" stroke-opacity="0.06" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 400 190;360 400 190" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="190" rx="250" ry="80" fill="none" stroke="#9b5de5" stroke-opacity="0.05" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 400 190;-360 400 190" dur="25s" repeatCount="indefinite"/>
  </ellipse>

  <!-- nodes -->
  <circle cx="160" cy="75" r="5" fill="#00F2FE" opacity="0.7" filter="url(#glowS)"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="75" r="12" fill="none" stroke="#00F2FE" stroke-opacity="0.12" stroke-width="1"><animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="95" r="4" fill="#f15bb5" opacity="0.7" filter="url(#glowS)"><animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- title -->
  <text x="60" y="100" font-family="'Segoe UI',-apple-system,sans-serif" font-size="36" font-weight="800" fill="url(#titleG)" filter="url(#glow)">
    MoluHuaLuo
    <animate attributeName="font-size" values="36;37;36" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="143" font-family="'Segoe UI',-apple-system,sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">
    ⚡ 花落 · Open Source Developer
    <animate attributeName="fill-opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="177" font-family="'Consolas','Cascadia Code','JetBrains Mono',monospace" font-size="13" fill="#94A3B8">
    ai_agents · mcp_ecosystem · win_android_automation
  </text>

  <!-- ====== TYPEWRITER EFFECT: 花落花开 终有末路 · 末路.花落 ====== -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif" font-size="20" fill="url(#scanG)">
    <!-- Chunk 1: 花落花开 (fades in 0s-1s) -->
    <text x="60" y="228" opacity="0" fill="url(#typeG)">
      花落花开
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.2;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <!-- Chunk 2: 终有末路 (fades in 1s-2s) -->
    <text x="160" y="228" opacity="0" fill="url(#typeG)">
      终有末路
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.4;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <!-- Chunk 3: · (fades in 2s-2.5s) -->
    <text x="257" y="228" opacity="0" fill="#9b5de5">
      ·
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <!-- Chunk 4: 末路.花落 (fades in 2.5s-3.5s) -->
    <text x="275" y="228" opacity="0" fill="url(#titleG)">
      末路.花落
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.65;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- blinking cursor -->
    <rect x="370" y="208" width="2.5" height="24" fill="#fbbf24" filter="url(#glowS)">
      <animate attributeName="opacity" values="1;0;1;0;1;0;1;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="60;65;70;75;80;85;90;95;100;105;110;115;120;125;130;135;140;145;150;155;160;275;275;275" dur="8s" repeatCount="indefinite" keyTimes="0;0.025;0.05;0.075;0.1;0.125;0.15;0.175;0.2;0.225;0.25;0.275;0.275;0.3;0.325;0.35;0.375;0.4;0.425;0.45;0.475;0.475;0.55;0.65" calcMode="discrete"/>
    </rect>
  </g>

  <!-- tech pills row 1 -->
  <g font-family="'Segoe UI',-apple-system,sans-serif" font-size="10" text-anchor="middle">
    <g><rect x="460" y="290" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="487" y="305" fill="#00F2FE">C/C++</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/></g>
    <g><rect x="525" y="290" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="552" y="305" fill="#c084fc">Python</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite" begin="0.5s"/></g>
    <g><rect x="590" y="290" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="617" y="305" fill="#fbbf24">Java</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite" begin="1s"/></g>
    <g><rect x="655" y="290" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="682" y="305" fill="#34d399">Vue</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite" begin="1.5s"/></g>
    <g><rect x="720" y="290" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="747" y="305" fill="#f472b6">C#</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite" begin="2s"/></g>
  </g>

  <!-- tech pills row 2 -->
  <g font-family="'Segoe UI',-apple-system,sans-serif" font-size="10" text-anchor="middle">
    <g><rect x="480" y="320" width="65" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="512" y="334" fill="#38bdf8">TypeScript</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite" begin="0.3s"/></g>
    <g><rect x="555" y="320" width="55" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="582" y="334" fill="#4ade80">Node.js</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite" begin="0.8s"/></g>
    <g><rect x="620" y="320" width="55" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="647" y="334" fill="#f87171">Docker</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite" begin="1.3s"/></g>
    <g><rect x="685" y="320" width="55" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="712" y="334" fill="#fbbf24">Claude</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite" begin="1.8s"/></g>
  </g>

  <!-- bottom -->
  <text x="60" y="370" font-family="'Segoe UI',-apple-system,sans-serif" font-size="11" fill="#475569">
    MIT Licensed · github.com/moluhualuo
    <tspan dx="12" fill="#00F2FE" opacity="0.8">●<animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/></tspan>
    <tspan dx="4" fill="#64748b">online</tspan>
  </text>
</svg>
